name: dtr

x-backup-env: &backup-env
  PGPASSWORD: ${DB_PASSWORD:?run install.sh first}
  BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?run install.sh first}
  BACKUP_HOUR: ${BACKUP_HOUR:-1}
  BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
  TZ: Asia/Manila

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dtr
      POSTGRES_PASSWORD: ${DB_PASSWORD:?run install.sh first}
      POSTGRES_DB: dtr
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dtr -d dtr"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ../server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dtr:${DB_PASSWORD}@db:5432/dtr?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?run install.sh first}
      PHOTO_KEY: ${PHOTO_KEY:?run install.sh again to add the photo key}
      CORS_ORIGINS: https://${SITE_ADDRESS},http://tauri.localhost
      TRUSTED_PROXIES: ${EDGE_SUBNET:-172.30.77.0/24}
      SEED_DEMO: "false"
    volumes:
      - photos:/data/photos
    networks: [backend, edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12

  web:
    build: ../apps/web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?run install.sh first}
      CADDY_TLS: ${CADDY_TLS:-internal}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]

  backup:
    build: ./backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: *backup-env
    volumes:
      - photos:/data/photos:ro
      - ./backups:/backups
    networks: [backend]

  # Used only by restore.sh.
  restore:
    build: ./backup
    profiles: [restore]
    entrypoint: ["/usr/local/bin/restore.sh"]
    environment: *backup-env
    volumes:
      - photos:/data/photos
      - ./backups:/backups:ro
    networks: [backend]

networks:
  backend:
    internal: true
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.30.77.0/24}

volumes:
  dbdata:
  photos:
  caddy_data:
  caddy_config:
